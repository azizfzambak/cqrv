# CI — report §9.5.1, §9.5.3, Table 9.5 (dependency-drift row).
# pinned:    blocking; the committed toolchain and lake-manifest.json.
# candidate: non-blocking, monthly + manual; newest Mathlib release tag in a temporary copy
#            (scripts/candidate_build.sh); never modifies the committed pins (CLAUDE.md rule 4).
# CI stays local (Stage 9b): scripts/ci_local.sh runs the `pinned` steps in this order on the
# development machine; keep the two lists in sync.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of each month
  workflow_dispatch:

jobs:
  pinned:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (toolchain from lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: lake build
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log

      - name: Warning check
        run: scripts/check_warnings.sh build.log

      - name: Sorry check
        run: |
          scripts/check_sorries.sh
          scripts/check_sorries.sh --self-test

      - name: CLI smoke (cqr check / extract / match / synthesize on examples/)
        run: scripts/cli_smoke.sh

      - name: Axiom audit (blocking, Stage 8b; CQRV.Certify named theorems + both committed certificates)
        run: scripts/print_axioms.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python harness requirements (full pinned set, Table 9.5)
        run: |
          pip install --no-deps -r tests/diff/requirements.lock
          pip check

      - name: Simulator self-test
        run: python -I tests/diff/statevector.py --selftest

      - name: Differential oracle test (101 predicates, every measurement branch)
        run: scripts/diff_oracles.sh

      - name: Front-end validation (Stage 9b; DSL evaluator = network = Python reference, corpus + 100 random)
        run: scripts/diff_frontend.sh

      - name: Synthesized circuits byte-identical to the golden file (Stage 6b-3, decision 1)
        run: scripts/check_oracle_json.sh

      - name: Diffusion and Grover circuit (Stage 5b, every branch; success probability)
        run: scripts/diff_grover.sh

      - name: Few-ancilla MCZ (Stage 12b; every branch, negative controls; few:log certified, 12d; every n, 13a)
        run: scripts/diff_mcz.sh

      - name: QFT / AQFT (Stage 18b; qftCircuit = R F, adjoint = inverse, both AQFT bounds, negative control)
        run: scripts/diff_qft.sh

      - name: Counting circuit (Stage 19b; phase-register distribution = the closed form, MBU = coherent, negative controls, grades vs composed bound, block replay, AQFT)
        run: scripts/diff_counting.sh

      - name: Second worked predicate simple_alu_x0_1 (Stage 9b; oracle every branch, Grover circuit 512 sampled branches; exact delta)
        run: scripts/diff_benchmark.sh

      - name: Install llvm (llvm-as for the QIR assembly check)
        run: sudo apt-get update && sudo apt-get install -y llvm && llvm-as --version

      - name: SHA3, certificate schema, QIR / QASM re-parse (Stage 8a; llvm-as mandatory)
        run: REQUIRE_LLVM_AS=1 scripts/check_emit.sh

      - name: cqr certify (Stage 8b; kernel check, audit, schema, hash link, reproducibility, negative tests)
        run: scripts/check_certify.sh

      - name: Certified selection (Stage 21a4; --budget / --prefer, the committed grover_pred_037_sel, no fit, refusals, negative kernel tests)
        run: scripts/check_select.sh

  candidate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build against newest Mathlib release (temporary copy)
        run: scripts/candidate_build.sh "$RUNNER_TEMP/cqrv-candidate"
